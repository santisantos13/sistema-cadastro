<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Página Inicial</title>
</head>

<body>
  <header class="header-home">
    <div class="header-conteudo">
      <h1><a href="index.html" class="logo">NexPlay</a></h1>

      <form action="">
        <input type="search" id="buscador" placeholder="Buscar no NexPlay" name="q" aria-label="Buscar no NexPlay">
        <button type="submit">Buscar</button>
      </form>

      <a href="login.html">
        <img src="Imagens/User.png" alt="Minha conta" id="user-img">
      </a>
    </div>
  </header>

  <main class="main-home">

    <a href="cadastro.html" class="banner">
      <img src="Imagens/banner-black-friday.png"
        alt="Black Friday na NexPlay: descontos imperdíveis em consoles, notebooks e acessórios gamer">
    </a>

    <section class="boas-vindas">
      <h2>Bem-vindo à NexPlay!</h2>
      <p>Games, consoles e notebooks gamer com os melhores preços.</p>
    </section>

    <section class="destaques">
      <article class="produto">
        <h3>PlayStation 5</h3>
        <p>O console da nova geração.</p>
      </article>

      <article class="produto">
        <h3>Steam Deck</h3>
        <p>Seus jogos de PC em qualquer lugar.</p>
      </article>

      <article class="produto">
        <h3>Notebook Gamer</h3>
        <p>Potência para jogar e trabalhar.</p>
      </article>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 Santhiago - Todos os direitos reservados</p>
  </footer>
</body>

</html>
